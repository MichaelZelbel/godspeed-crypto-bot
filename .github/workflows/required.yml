name: required
# The one check main requires: nothing reaches main except through a pull request whose
# `required` check passed. That check name is what the main-branch rules name.
#
# Job `suite` runs the repository's own checks on every pull request: the tests, the lint, the
# check that no private detail is in the tree, the installer's syntax, and the gate's own self-test.
# tests/test_install.sh needs a systemd container and is not run here. A review does not change
# the code, so a pull_request_review event skips the suite and only the gate runs again.
#
# Job `required` asks the two questions, each answered with one plain line, in
# .github/workflows/required-gate.mjs (the same file as in the Godspeed Mission Control product
# repository, where it is maintained; only the example login in its self-tests differs, because
# scripts/check-private-details.sh forbids a person's name in this tree): every other check on
# this commit passed, and on a pull request a reviewer listed in the repository variable
# REQUIRED_REVIEWERS approved this commit. Everything here only reads.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read
  statuses: read
  issues: read
jobs:
  suite:
    name: suite
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: No private detail in the tree
        run: bash scripts/check-private-details.sh
      - name: The installer parses
        run: bash -n install.sh
      - name: The gate proves itself
        run: node .github/workflows/required-gate.mjs --self-test
  required:
    name: required
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every other check on this commit passed, and a listed reviewer approved it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED_REVIEWERS: ${{ vars.REQUIRED_REVIEWERS }}
        run: node .github/workflows/required-gate.mjs
